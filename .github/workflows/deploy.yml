name: Deploy Eureka

on:
  push:
    branches:
      - feat/cicd  # 브랜치 push 시 자동 실행
  workflow_dispatch:  # 수동 실행도 가능

env:
  AWS_REGION: ap-northeast-2
  IMAGE_NAME: eureka-service  # ECR 리포지토리명 + Docker 이미지명

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. AWS 인증 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 5. Docker 이미지 빌드
      - name: Build Docker Image
        run: |
          ./gradlew bootJar
          docker build -t $IMAGE_NAME:latest .

      # 6. Docker 이미지 태깅 및 ECR Push
      - name: Tag and Push to ECR
        run: |
          docker tag $IMAGE_NAME:latest ${{ steps.login-ecr.outputs.registry }}/$IMAGE_NAME
          docker push ${{ steps.login-ecr.outputs.registry }}/$IMAGE_NAME

      # 7. SSH 및 .env 파일 구성
      - name: Prepare SSH and .env
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOCCONNETING_SSH_KEY }}" | base64 --decode > ~/.ssh/docconneting.pem
          chmod 600 ~/.ssh/docconneting.pem

          cat <<EOF > ~/.ssh/config
          Host bastion
            HostName ${{ secrets.BASTION_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/docconneting.pem
            StrictHostKeyChecking no

          Host eureka
            HostName ${{ secrets.EUREKA_PRIVATE_IP }}
            User ubuntu
            IdentityFile ~/.ssh/docconneting.pem
            ProxyJump bastion
            StrictHostKeyChecking no
          EOF

          ssh eureka "echo 'SPRING_PROFILES_ACTIVE=prod' > ~/eureka.env"

      # 8. EC2 배포 (Docker 설치 포함)
      - name: Deploy to EC2
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}

          ssh eureka <<EOF
            echo "Deploying image: $IMAGE"

            # Docker 미설치 시 설치
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt update
              sudo apt install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker ubuntu
            fi

            # 컨테이너 정리
            sudo docker stop eureka || true
            sudo docker rm eureka || true
            sudo docker container prune -f
            sudo docker image prune -a -f
            sudo docker volume prune -f
            sudo docker network prune -f

            # 최신 이미지 pull 및 실행
            sudo docker pull $IMAGE
            sudo docker run -d \
              --name eureka \
              --env-file ~/eureka.env \
              -p 8761:8761 \
              $IMAGE
          EOF
