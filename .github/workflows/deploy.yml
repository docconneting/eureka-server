name: Deploy Eureka  # 워크플로 이름

on:
  push:
    branches:
      - feat/cicd  # 해당 브랜치에 push될 때 작동
  workflow_dispatch:  # GitHub UI에서 수동 실행도 가능하게 설정

env:
  AWS_REGION: ap-northeast-2  # 배포할 리전
  IMAGE_NAME: eureka-service  # ECR 이미지 이름 및 컨테이너 이름으로도 사용됨

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # GitHub Actions가 실행될 환경

    steps:
      # 1. GitHub 리포지토리 코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java 17 환경 설정 (Gradle 빌드용)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. AWS 자격 증명 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Docker 이미지 빌드
      - name: Build Docker Image
        run: |
          ./gradlew bootJar             # Spring Boot JAR 빌드
          docker build -t $IMAGE_NAME:latest .  # Docker 이미지 빌드

      # 6. Docker 이미지 태그 및 ECR 푸시
      - name: Tag and Push to ECR
        run: |
          docker tag $IMAGE_NAME:latest ${{ steps.login-ecr.outputs.registry }}/$IMAGE_NAME
          docker push ${{ steps.login-ecr.outputs.registry }}/$IMAGE_NAME

      # 7. SSH 설정 및 .env 생성
      - name: Prepare SSH and .env
        run: |
          # SSH 키 파일 설정
          mkdir -p ~/.ssh
          echo "${{ secrets.DOCCONNETING_SSH_KEY }}" | base64 --decode > ~/.ssh/docconneting.pem
          chmod 600 ~/.ssh/docconneting.pem

          # SSH config 생성 (bastion → eureka 프록시 접속)
          cat <<EOF > ~/.ssh/config
          Host bastion
            HostName ${{ secrets.BASTION_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/docconneting.pem
            StrictHostKeyChecking no

          Host eureka
            HostName ${{ secrets.EUREKA_PRIVATE_IP }}
            User ubuntu
            IdentityFile ~/.ssh/docconneting.pem
            ProxyJump bastion
            StrictHostKeyChecking no
          EOF

          # EC2 내부에서 사용할 .env 파일 생성
          ssh eureka "echo 'SPRING_PROFILES_ACTIVE=prod' > ~/eureka.env"

      # 8. EC2에서 컨테이너 실행 및 청소
      - name: Deploy to EC2
        run: |
          ssh eureka <<'EOF'
            # Docker 설치 (없을 경우)
            if ! command -v docker &> /dev/null; then
              echo "Docker not found, installing..."
              sudo apt update
              sudo apt install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker ubuntu
            fi

            # 환경 변수
            IMAGE=${{ steps.login-ecr.outputs.registry }}/$IMAGE_NAME

            # 기존 컨테이너 중지 및 삭제
            sudo docker stop eureka || true && sudo docker rm eureka || true

            # 안 쓰는 리소스 정리
            sudo docker container prune -f
            sudo docker image prune -a -f
            sudo docker volume prune -f
            sudo docker network prune -f

            # 최신 이미지 pull
            sudo docker pull $IMAGE

            # 컨테이너 실행
            sudo docker run -d \
              --name eureka \
              --env-file ~/eureka.env \
              -p 8761:8761 \
              $IMAGE
          EOF
      
      
